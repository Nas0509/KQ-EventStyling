name: Publish KQ Event Styling

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Prepare public website files
        shell: bash
        run: |
          mkdir -p _site
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|.gitignore|.gitattributes|README.md|package.json|package-lock.json|*.sql|supabase/*|node_modules/*|.vs/*) continue ;;
            esac
            mkdir -p "_site/$(dirname "$file")"
            cp "$file" "_site/$file"
          done < <(git ls-files -z)
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
