<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | KQ Event Styling</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<header class="site-header">
    <a href="index.html" class="brand">
        <img src="kqlogo.png" alt="KQ Event Styling Logo">
        <div class="brand-text"><strong>KQ</strong><span>EVENT STYLING</span></div>
    </a>
</header>
<main class="login-page">
    <section class="login-card">
        <div class="login-logo"><img src="kqlogo.png" alt="KQ Event Styling"></div>
        <span class="badge">ACCOUNT RECOVERY</span>
        <h1>Reset Password</h1>
        <p class="subtitle">Choose a new password for your KQ Event Styling account.</p>
        <p id="resetMessage" class="message" role="status" aria-live="polite"></p>
        <form id="resetForm" hidden>
            <div class="field">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
                <small>Use at least 8 characters, including uppercase and lowercase letters, a number, and a symbol.</small>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required placeholder="Re-enter your new password">
            </div>
            <button type="submit" class="login-button">Save New Password</button>
        </form>
        <p class="signup-text" style="margin-top: 25px;"><a href="login.html">Back to Login</a></p>
    </section>
</main>
<footer>© 2026 KQ Event Styling. All Rights Reserved.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20261027-password-recovery"></script>
<script src="reset-password.js?v=20261027-password-recovery"></script>
</body>
</html>
