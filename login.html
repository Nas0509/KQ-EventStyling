<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | KQ Event Styling</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="site-header">

        <a href="index.html" class="brand">

            <img src="kqlogo.png"
                 alt="KQ Event Styling Logo">

            <div class="brand-text">
                <strong>KQ</strong>
                <span>EVENT STYLING</span>
            </div>

        </a>

    </header>


    <main class="login-page">

        <section class="login-card">


            <!-- LOGO -->

            <div class="login-logo">

                <img src="kqlogo.png"
                     alt="KQ Event Styling">

            </div>


            <span class="badge">
                KQ EVENT STYLING
            </span>


            <h1>
                Welcome Back!
            </h1>


            <p class="subtitle">
                Login to continue to your account.
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="field">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           placeholder="Enter your email"
                           autocomplete="email"
                           required>

                </div>


                <!-- PASSWORD -->

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrap">

                        <input type="password"
                               id="password"
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>

                        <button type="button"
                                id="togglePassword"
                                aria-label="Show password">
                            Show
                        </button>

                    </div>

                </div>


                <!-- REMEMBER / FORGOT -->

                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox"
                               id="rememberMe">

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a href="forgot-password.html"
                       class="forgot-link">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit"
                        class="login-button">
                    Login
                </button>


                <!-- MESSAGE -->

                <p id="message"
                   class="message"></p>


            </form>


            <!-- DIVIDER -->

            <div class="divider">
                <span>OR</span>
            </div>


            <!-- SIGN UP -->

            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>


        </section>

    </main>


    <footer>

        © 2026 KQ Event Styling. All Rights Reserved.

    </footer>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="login.js"></script>

</body>
</html>
