<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | KQ Event Styling</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<header class="site-header">
    <a href="index.html" class="brand">
        <img src="kqlogo.png" alt="KQ Event Styling Logo">
        <div class="brand-text">
            <strong>KQ</strong>
            <span>EVENT STYLING</span>
        </div>
    </a>
</header>

<main class="login-page">
    <section class="login-card">

        <div class="login-logo">
            <img src="kqlogo.png" alt="KQ Event Styling">
        </div>

        <span class="badge">ACCOUNT RECOVERY</span>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your email address and we'll send instructions to reset your password.
        </p>

        <form id="forgotForm">

            <div class="field">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Send Reset Link
            </button>

            <p id="forgotMessage" class="message"></p>

        </form>

        <p class="signup-text" style="margin-top: 25px;">
            Remember your password?
            <a href="login.html">Back to Login</a>
        </p>

    </section>
</main>

<footer>
    © 2026 KQ Event Styling. All Rights Reserved.
</footer>

<script>
document.getElementById("forgotForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const message = document.getElementById("forgotMessage");

    message.textContent =
        "If an account exists with this email, password reset instructions will be sent.";
    message.className = "message success";
});
</script>

</body>
</html>
